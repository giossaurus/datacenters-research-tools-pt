# Registros sem coordenadas → concelho pelo nome da cidade na fonte
concelho_por_cidade:
  Lisbon: Lisboa
  Lisboa: Lisboa
  Porto: Porto

# Nominatim (zoom 10) às vezes devolve a cidade/localidade em vez do município → correção explícita
concelho_correcoes:
  Ermesinde: Valongo

# Localização corrigida por site quando a coordenada da fonte contradiz o endereço da própria fonte
localizacao_correcoes:
  dccom-azores-cls-data-center-google:
    concelho: Lagoa (Açores)
    motivo: "coordenada do datacenters.com cai em Tondela; endereço na fonte = Rua da Alagoa, 9560-421 (Lagoa, São Miguel)"

# Sites mantidos na contagem, mas com evidência fraca de serem inquilinos/extintos → nota de sensibilidade no texto
# (decisão do Giovanni, 07/10; enriquecimento D, confiança baixa)
sensibilidade_evidencia_fraca:
  dccom-lisbon-data-center-leapswitch-networks-private-limited: "possível inquilino na PTisp/Equinix (anúncio de 2015)"
  nfsi-lisbon1: "empresa possivelmente extinta (domínio hoje é de outra firma)"
  nfsi-porto-1: "empresa possivelmente extinta (domínio hoje é de outra firma)"
