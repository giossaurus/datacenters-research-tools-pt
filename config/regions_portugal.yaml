# Portugal: mapeamento distritos/concelhos → regiões NUTS II (nomenclatura 2024).
#
# Fonte de referência geográfica: DGT/CAOP (Direção-Geral do Território).
# Nota 2024: a antiga "Lisboa e Vale do Tejo" foi desmembrada em:
#   - Grande Lisboa
#   - Península de Setúbal
#   - Oeste e Vale do Tejo
#
# ESTRUTURA:
#   city_to_admin  → chave = source_city no CSV (nome em config.cities[].name ou
#                    nome devolvido pelo datacentermap.com) → valor = código de distrito
#   admin_to_region → código de distrito → região NUTS II
#
# Apague ou comente linhas que não queira incluir na análise.
# Coordenadas por distrito são informativas (o código lê lat/lon do CSV, não deste ficheiro).

label_admin: "Distrito"

city_to_admin:

  # ── NORTE ────────────────────────────────────────────────
  # Distrito do Porto  (lat 41.1621, lon -8.6220)
  Porto: POR
  Vila Nova de Gaia: POR
  Matosinhos: POR
  Maia: POR

  # Distrito de Braga  (lat 41.5503, lon -8.4200)
